<meta charset="utf-8">
<title>ZAPE Pedidos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: duas telas do mesmo sistema. Cliente: celular, faixa dourada no topo com o card da foto
   da etapa atual sobreposto e a linha do tempo abaixo. Loja: painel com lista de pedidos e
   detalhe lateral para postar foto e avançar etapa. Identidade ZAPE: preto, dourado, tipografia de estádio. */
:root{
  --ink:#0c0b0a; --panel:#151412; --panel2:#1c1a17; --paper:#f2eee5; --muted:#a39d91; --dim:#6f6a61;
  --gold:#daa520; --gold-hi:#f0c95a; --gold-soft:rgba(218,165,32,.14);
  --line:rgba(242,238,229,.12); --ok:#3fbf6f; --wa:#1f9d55;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.92;margin:0;text-wrap:balance}
p{margin:0}
.lbl{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:3px;border:1px solid var(--line);background:transparent;font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--paper)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#140f02}
.btn-gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-sm{height:36px;padding:0 12px;font-size:14px}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold-hi);white-space:nowrap}
.chip.done{background:rgba(63,191,111,.14);color:#7fe0a3}
.chip.wait{background:rgba(255,255,255,.07);color:var(--muted)}

/* barra do protótipo */
.demo{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#000;border-bottom:1px solid var(--line)}
.demo .in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo p{font-size:13px;color:var(--muted)}
.demo p b{color:var(--gold);font-family:var(--f-label);letter-spacing:.14em;text-transform:uppercase;margin-right:6px}
.seg{display:flex;padding:3px;border-radius:20px;border:1px solid var(--line);gap:2px}
.seg button{height:30px;padding:0 14px;border:0;border-radius:16px;background:none;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}

/* ============ CLIENTE ============ */
.client{min-height:100vh}
.phone{max-width:480px;margin:0 auto;background:var(--ink);min-height:100%;position:relative}
@media (min-width:700px){.client{background:radial-gradient(70% 50% at 50% 0%,#221f1a,var(--ink) 70%);padding-block:28px}.phone{border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.c-top{position:relative;padding:18px 18px 120px;background:
  radial-gradient(90% 120% at 80% 0%,rgba(240,201,90,.55),transparent 60%),
  linear-gradient(160deg,#b98714,#6d4f0c 60%,#2a2008);overflow:hidden}
.c-top::after{content:"";position:absolute;right:-60px;top:-40px;width:260px;height:260px;opacity:.12;background:url("assets/logo.png") center/contain no-repeat;transform:rotate(-12deg)}
.c-top .bar{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.c-top .bar img{height:24px}
.c-top .bar span{font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#1a1204;background:rgba(255,255,255,.5);padding:4px 10px;border-radius:12px}
.c-top h1{position:relative;z-index:1;margin-top:22px;font-size:40px;color:#140f02}
.c-top .who{position:relative;z-index:1;margin-top:6px;font-weight:600;color:#2a1d04}
.hero{position:relative;margin:-104px 14px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.55);z-index:2}
.hero .ph{position:relative;aspect-ratio:4/3;max-width:100%;background:#26231e;cursor:zoom-in}
.hero .ph img{width:100%;height:100%;object-fit:cover;display:block}
.hero .ph .ago{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600;background:rgba(12,11,10,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 10px;border-radius:14px}
.hero .ph .ago i{width:8px;height:8px;border-radius:50%;background:#ff4d4d;box-shadow:0 0 0 0 rgba(255,77,77,.6);animation:live 1.6s infinite}
.hero .ph .ex{position:absolute;right:12px;top:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(12,11,10,.7);color:var(--muted);padding:3px 8px;border-radius:10px}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
.hero .noph{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;gap:10px;padding:24px;background:repeating-linear-gradient(135deg,#1d1b18 0 14px,#191714 14px 28px);color:var(--muted);font-size:14px}
.hero .noph svg{width:54px;height:54px;color:var(--gold)}
.hero .body{position:relative;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px}
.hero .now{display:flex;align-items:center;gap:12px}
.hero .now .ic{flex:0 0 46px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#140f02}
.hero .now .ic svg{width:22px;height:22px}
.hero h2{font-size:34px}
.hero .note{font-size:15px;color:#d8d2c6}
.hero .call{position:absolute;right:14px;top:-26px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--wa);color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.45);text-decoration:none}
.hero .call svg{width:24px;height:24px}
.prog{padding:18px 18px 4px;display:flex;flex-direction:column;gap:10px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog .row b{font-family:var(--f-display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;color:var(--gold)}
.prog .row span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks{display:grid;gap:3px}
.ticks i{height:8px;border-radius:2px;background:rgba(255,255,255,.08)}
.ticks i.on{background:var(--gold)}
.ticks i.cur{background:linear-gradient(90deg,var(--gold),var(--gold-hi));animation:cur 1.4s ease-in-out infinite alternate}
@keyframes cur{to{opacity:.55}}
.facts{margin:14px 18px 0;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.facts div{padding:12px 14px}
.facts div+div{border-left:1px solid var(--line)}
.facts div:nth-child(3){border-left:0}
.facts div:nth-child(n+3){border-top:1px solid var(--line)}
.facts dt{font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:600;font-size:15px}
.tl-h{display:flex;justify-content:space-between;align-items:baseline;padding:28px 18px 10px}
.tl-h h3{font-size:26px}
.tl{list-style:none;margin:0;padding:0 18px}
.tl li{display:grid;grid-template-columns:50px 22px 1fr;gap:0 10px;position:relative}
.tl .d{padding-top:2px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.25;text-align:right}
.tl .d small{display:block;font-size:12px;color:var(--dim)}
.tl .dot{position:relative;display:flex;justify-content:center}
.tl .dot::before{content:"";position:absolute;top:18px;bottom:-4px;left:50%;border-left:2px dashed rgba(255,255,255,.14);transform:translateX(-1px)}
.tl li:last-child .dot::before{display:none}
.tl .dot i{position:relative;margin-top:4px;width:14px;height:14px;border-radius:50%;background:#4a463f;border:3px solid var(--ink)}
.tl li.cur .dot i{width:18px;height:18px;margin-top:2px;background:var(--gold);box-shadow:0 0 0 4px rgba(218,165,32,.25)}
.tl li.cur .dot::before{border-left-color:rgba(218,165,32,.5)}
.tl .t{padding-bottom:22px;min-width:0}
.tl .t b{display:block;font-family:var(--f-label);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.tl li.cur .t b{color:var(--gold-hi)}
.tl .t p{font-size:14px;color:var(--muted);margin-top:2px}
.tl li.cur .t p{color:#d8d2c6}
.tl .thumbs{display:flex;gap:6px;margin-top:8px}
.tl .thumbs button{width:72px;height:54px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;background:#222}
.tl .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.next{margin:4px 18px 0;border:1px solid var(--line);border-radius:12px}
.next summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.next summary::-webkit-details-marker{display:none}
.next summary span{color:var(--muted);font-weight:600}
.next ol{list-style:none;margin:0;padding:0 16px 10px;counter-reset:n}
.next li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);color:var(--muted)}
.next li .ic{flex:0 0 34px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.next li .ic svg{width:17px;height:17px}
.next li b{font-family:var(--f-label);font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.next li small{margin-left:auto;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.c-foot{padding:26px 18px calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:stretch;text-align:center}
.c-foot p{font-size:13px;color:var(--dim)}
.lookup{padding:60px 22px;display:flex;flex-direction:column;gap:14px}
.lookup input{height:50px;font:600 18px var(--f-body);color:var(--paper);background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:0 14px;text-transform:uppercase}

/* ============ LOJA (ADMIN) ============ */
.admin{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 47px)}
@media (max-width:900px){.admin{grid-template-columns:1fr}}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:#0f0e0c}
@media (max-width:900px){.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-left,0px));align-items:center}}
.side img{height:26px;margin:0 8px 22px;align-self:flex-start}
@media (max-width:900px){.side img{margin:0 10px 0 0}}
.nav{display:flex;align-items:center;gap:10px;height:42px;padding:0 12px;border:0;border-radius:3px;background:none;cursor:pointer;font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left}
.nav svg{width:18px;height:18px}
.nav:hover{color:var(--paper)}
.nav[aria-current="page"]{background:var(--gold-soft);color:var(--gold-hi)}
.nav .n{margin-left:auto;font-size:13px;background:rgba(255,255,255,.08);padding:1px 7px;border-radius:9px;color:var(--paper)}
.main{padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));min-width:0}
@media (min-width:901px){.main{padding:28px 32px 48px}}
.mhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:14px;margin-bottom:22px}
.mhead h1{font-size:46px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:16px;background:none;cursor:pointer;font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);background:#11100e}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr[aria-selected="true"]{background:var(--gold-soft)}
td .id{font-family:var(--f-label);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--muted);font-size:13px}
.mini-bar{width:110px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--gold)}
td .pc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}

/* detalhe do pedido */
.drawer-ov{position:fixed;inset:0;z-index:70}
.drawer-ov .bd{position:absolute;inset:0;background:rgba(5,5,4,.66);animation:fade .2s}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slide .3s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:34px}
.drawer header p{color:var(--muted);font-size:14px;margin-top:4px}
.x{flex:0 0 40px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.drawer .sc{flex:1;overflow:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:22px}
.linkbox{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px dashed rgba(218,165,32,.5);border-radius:4px;background:rgba(218,165,32,.06)}
.linkbox svg{flex:0 0 18px;width:18px;height:18px;color:var(--gold)}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--gold-hi)}
.share{display:flex;flex-wrap:wrap;gap:8px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.steps li button{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;background:none;cursor:pointer;text-align:left;font-size:14px;color:var(--muted)}
.steps li button svg{flex:0 0 16px;width:16px;height:16px}
.steps li button.done{color:var(--paper)}
.steps li button.done svg{color:#7fe0a3}
.steps li button.cur{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-hi)}
.steps li button.sel{outline:2px solid var(--paper);outline-offset:1px}
.upd{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
.upd h3{font-size:24px}
.field{display:flex;flex-direction:column;gap:5px;font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.field input,.field textarea,.field select{font:16px var(--f-body);color:var(--paper);background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:10px 12px;letter-spacing:0;text-transform:none;min-width:0;width:100%}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold)}
.drop{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border:1px dashed var(--line);border-radius:4px;cursor:pointer}
.drop:hover{border-color:var(--gold)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.drop .pv{flex:0 0 74px;width:74px;height:56px;border-radius:4px;background:#26231e center/cover;display:grid;place-items:center;color:var(--gold)}
.drop .pv svg{width:22px;height:22px}
.drop span{font-size:14px;color:var(--muted)}
.drop b{display:block;color:var(--paper);font-weight:600}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:4px}
.hist li .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.hist li .ic svg{width:15px;height:15px}
.hist b{font-family:var(--f-label);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase}
.hist p{font-size:13px;color:var(--muted)}
.hist time{font-size:12px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.hist img{width:64px;height:48px;object-fit:cover;border-radius:3px;margin-top:6px;display:block}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form2 .full{grid-column:1/-1}
@media (max-width:520px){.form2{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.pcard .im{aspect-ratio:4/3;max-width:100%;background:#d9d7d2 center/cover}
.pcard .b{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.pcard b{font-family:var(--f-label);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.pcard .row{display:flex;gap:6px;margin-top:auto;align-items:center;justify-content:space-between}
.tg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tg input{width:16px;height:16px;accent-color:var(--gold)}
.cards.cat{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.cards.cat .row{gap:8px}.cards.cat .row .btn{margin-left:auto}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.subtabs button{border:0;background:none;padding:10px 14px;font-family:var(--f-label);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--gold)}
.catbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.fchips{display:flex;flex-wrap:wrap;gap:4px}
.fchips button{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:none;color:var(--muted);font-family:var(--f-label);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.fchips button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.pcard .im{position:relative}
.pcard.off .im{filter:grayscale(1) brightness(.55)}
.cbadge{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:2px;background:rgba(12,11,10,.8);font-family:var(--f-label);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper)}
.cbadge.hid{left:auto;right:8px;color:var(--gold-hi)}
.pcard .sub{font-size:13px;color:var(--muted);margin-top:-6px}
.pills{display:flex;flex-wrap:wrap;gap:4px}.pills span{font-size:12px;padding:2px 7px;border:1px solid var(--line);border-radius:10px;color:var(--muted)}
.ord{display:flex;gap:2px}.x.sm{flex-basis:30px;width:30px;height:30px;font-size:18px;line-height:1;color:var(--paper)}.x.sm:disabled{opacity:.3;cursor:default}
.cks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px;text-transform:none;letter-spacing:0;font-family:var(--f-body)}
fieldset.field{border:0;padding:0;margin:0}
.phedit{display:flex;gap:12px;align-items:end}.phedit .im{width:180px;aspect-ratio:4/3;border-radius:4px;border:1px solid var(--line);background:#d9d7d2 center/cover;display:grid;place-items:center;color:#555}.phedit .im svg{width:28px;height:28px}
.loja{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px}.loja .full{grid-column:1/-1}
@media (max-width:640px){.loja{grid-template-columns:1fr}}

.note{font-size:13px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:4px}

.lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px;animation:fade .2s;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--paper);color:var(--ink);font-weight:600;padding:12px 18px;border-radius:3px;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);animation:toastIn .25s}
.paycard{position:relative;z-index:2;margin:14px 14px 0;padding:20px 18px;border:1px solid rgba(218,165,32,.55);border-radius:16px;background:linear-gradient(160deg,#2a2210,#151412 70%);display:flex;flex-direction:column;gap:12px}
.paycard .amt{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.paycard .sub{font-size:14px;color:var(--muted)}
.paybtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paybtns .btn{width:100%}
.secure{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.secure svg{width:14px;height:14px}
.paymodal{position:fixed;inset:0;z-index:80;display:grid;place-items:end center}
@media (min-width:600px){.paymodal{place-items:center}}
.paymodal .bd{position:absolute;inset:0;background:rgba(5,5,4,.75);animation:fade .2s}
.paysheet{position:relative;width:min(440px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:stretch;animation:up .3s cubic-bezier(.2,.8,.2,1)}
@media (min-width:600px){.paysheet{border-radius:18px}}
.paysheet h2{font-size:34px}
.paysheet .qr{align-self:center;width:200px;height:200px;background:#f4f1ea;border-radius:10px;padding:10px}
.paysheet code{display:block;font-size:12px;color:var(--muted);background:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px;word-break:break-all}
.paysheet .demo-note{font-size:12px;color:var(--dim);text-align:center}
.paychip{display:inline-flex;height:24px;align-items:center;padding:0 9px;border-radius:12px;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.paychip.ok{background:rgba(63,191,111,.14);color:#7fe0a3}
.paychip.wait{background:rgba(255,120,80,.14);color:#ffb08f}
.paychip.part{background:var(--gold-soft);color:var(--gold-hi)}
.payline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
.payline b{color:var(--paper);font-variant-numeric:tabular-nums}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function fakeQR(seed){ const r = (()=>{ let x = seed; return () => (x = (x*1103515245+12345) % 2147483648) / 2147483648; })(); const n=29; let p='';
  const finder = (cx,cy) => `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#141414"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#f4f1ea"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#141414"/>`;
  for (let y=0;y<n;y++) for (let x=0;x<n;x++){ const inF = (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9); if (!inF && r()<.48) p+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" role="img" aria-label="QR code Pix de exemplo" shape-rendering="crispEdges"><g fill="#141414">${p}</g>${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`; }
function openPay(o, pay, how){
  const code = `00020126580014BR.GOV.BCB.PIX0136zape-exemplo-${o.id.toLowerCase()}5204000053039865406${pay.valor.toFixed(2)}5802BR5913ZAPE SPORT WEAR6009SAO PAULO`;

    ${how==='pix' ? `${fakeQR(o.id.length*97+pay.valor)}
      <p class="note" style="font-size:14px;color:var(--muted)">Abra o app do seu banco, escolha Pix e leia o QR code, ou copie o código abaixo.</p>
      <code id="pixcode">${h(code)}</code>

    : `<p style="font-size:15px;color:#d8d2c6">Você vai para a página segura da plataforma de pagamento para digitar os dados do cartão e escolher as parcelas.</p>

  root.querySelector('#copyPix')?.addEventListener('click', async e => { try { await navigator.clipboard.writeText(code); e.target.textContent='Código copiado'; } catch(_) { e.target.textContent='Selecione o código e copie'; } });
  root.querySelector('#goCard')?.addEventListener('click', () => toast('No site real, aqui abre a página de pagamento da plataforma.'));

function shrink(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onerror=rej; r.onload=()=>{ const im = new Image(); im.onerror=rej; im.onload=()=>{

  const on = C.filter(x=>x.on).length;
  m.innerHTML = `<div class="mhead"><div><span class="lbl">Conteúdo do site</span><h1>Site</h1></div>
      ${siteTab==='catalogo'?`<button class="btn btn-gold" id="novoMod" type="button">${svg('plus')} Novo modelo</button>`:''}</div>
    <div class="subtabs" role="tablist">${[['catalogo','Catálogo'],['loja','Informações da loja']].map(([k,l])=>`<button type="button" role="tab" data-st="${k}" aria-selected="${siteTab===k}">${l}</button>`).join('')}</div>
    ${siteTab==='catalogo' ? `
    <div class="catbar"><p class="note" style="margin:0"><b>${C.length} modelos</b> · ${on} aparecem na arara e no catálogo do site</p>
      <div class="fchips">${['todos','futebol','feminino','regata','short'].map(k=>`<button type="button" data-cf="${k}" aria-pressed="${catFilter===k}">${k==='todos'?'Todos':CAT_LABEL[k]}</button>`).join('')}</div></div>
    <div class="cards cat">${C.map((x,i)=>(catFilter==='todos'||x.cat===catFilter)?`<div class="pcard${x.on?'':' off'}">
      <div class="im" style="background-image:url('${h(x.foto)}')"><span class="cbadge">${CAT_LABEL[x.cat]||''}</span>${x.on?'':'<span class="cbadge hid">Fora da arara</span>'}</div>
      <div class="b"><b>${h(x.nome)}</b><span class="sub">${h(x.tipo)}</span>
        <div class="pills">${x.pecas.map(p=>`<span>${PECA_LABEL[p]}</span>`).join('')}</div>
        <div class="row"><label class="tg"><input type="checkbox" data-on="${i}" ${x.on?'checked':''}> Na arara</label>
          <span class="ord"><button type="button" class="x sm" data-mv="${i}" data-d="-1" aria-label="Mover ${h(x.nome)} para antes" ${i===0?'disabled':''}>‹</button><button type="button" class="x sm" data-mv="${i}" data-d="1" aria-label="Mover ${h(x.nome)} para depois" ${i===C.length-1?'disabled':''}>›</button></span>
          <button class="btn btn-sm" type="button" data-ed="${i}">Editar</button></div></div></div>`:'').join('')}</div>`
    : `<form class="upd loja" id="lojaF">
      <label class="field">WhatsApp da loja<input id="lW" inputmode="tel" placeholder="(11) 90000-0000" value="${h(DB.loja.wa)}"></label>
      <label class="field">Instagram<input id="lI" value="${h(DB.loja.insta)}"></label>
      <label class="field">Horário de atendimento<input id="lH" value="${h(DB.loja.horario)}"></label>
      <label class="field">Cidade<input id="lC" placeholder="Ex.: Santos, SP" value="${h(DB.loja.cidade)}"></label>
      <label class="field full">Texto de apresentação<textarea id="lS">${h(DB.loja.sobre)}</textarea></label>
      <div class="full"><button class="btn btn-gold" type="submit">Salvar</button></div></form>`}
    <p class="note" style="margin-top:14px">Nesta demonstração as mudanças ficam guardadas neste navegador. No sistema final, salvar aqui muda o site na hora.</p>`;
  m.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ siteTab=b.dataset.st; adminSite(); });
  m.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{ catFilter=b.dataset.cf; adminSite(); });
  m.querySelectorAll('[data-on]').forEach(c=>c.addEventListener('change',()=>{ C[+c.dataset.on].on=c.checked; save(); adminSite(); toast(c.checked?'Aparece na arara':'Saiu da arara'); }));
  m.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.mv, j=i+(+b.dataset.d); [C[i],C[j]]=[C[j],C[i]]; save(); adminSite(); toast('Ordem da arara atualizada'); });
  m.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editModel(+b.dataset.ed));
  const nm = m.querySelector('#novoMod'); if (nm) nm.onclick = () => editModel(-1);
  const lf = m.querySelector('#lojaF'); if (lf) lf.onsubmit = e => { e.preventDefault();
    Object.assign(DB.loja,{wa:lf.querySelector('#lW').value.trim(), insta:lf.querySelector('#lI').value.trim(), horario:lf.querySelector('#lH').value.trim(), cidade:lf.querySelector('#lC').value.trim(), sobre:lf.querySelector('#lS').value.trim()}); save(); toast('Informações salvas'); };
}
function editModel(i){
  const novo = i<0; const x = novo ? {id:'m'+Date.now(), nome:'', tipo:'', cat:'futebol', pecas:['conjunto','camisa','calcao'], tecidos:['liso','colmeia','3d'], feat:'', tam:'', foto:'', on:true} : {...DB.catalogo[i]};
  const ck = (name, map, sel) => `<div class="cks">${Object.entries(map).map(([k,l])=>`<label class="tg"><input type="checkbox" name="${name}" value="${k}" ${sel.includes(k)?'checked':''}> ${l}</label>`).join('')}</div>`;
  const {root, close} = layer(`<div class="drawer-ov" role="dialog" aria-modal="true" aria-labelledby="et"><div class="bd" data-close></div><aside class="drawer">
    <header><div><span class="lbl">Catálogo</span><h2 id="et">${novo?'Novo modelo':h(x.nome)}</h2></div><button class="x" data-close aria-label="Fechar">${svg('x',2)}</button></header>
    <form class="sc" id="mf">
      <div class="phedit"><div class="im" id="mfIm" style="background-image:url('${h(x.foto)}')">${x.foto?'':svg('cam')}</div>
        <label class="btn btn-sm" style="position:relative;align-self:start">${x.foto?'Trocar foto':'Escolher foto'}<input type="file" accept="image/*" id="mfPh" style="position:absolute;inset:0;opacity:0;cursor:pointer" aria-label="Foto do modelo"></label></div>
      <label class="field">Nome do modelo<input id="mfN" required value="${h(x.nome)}" placeholder="Ex.: Lisboa Premium"></label>
      <label class="field">Tipo<input id="mfT" value="${h(x.tipo)}" placeholder="Ex.: Uniforme futebol"></label>
      <label class="field">Categoria<select id="mfC">${Object.entries(CAT_LABEL).map(([k,l])=>`<option value="${k}" ${x.cat===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <fieldset class="field"><legend>Peças</legend>${ck('pc', PECA_LABEL, x.pecas)}</fieldset>
      <fieldset class="field"><legend>Tecidos</legend>${ck('tc', TEC_LABEL, x.tecidos)}</fieldset>
      <label class="field">Características (uma por linha)<textarea id="mfF" rows="4">${h(x.feat)}</textarea></label>
      <label class="field">Tamanhos<input id="mfZ" value="${h(x.tam)}" placeholder="Ex.: Infantil ao GG"></label>
      <label class="tg"><input type="checkbox" id="mfO" ${x.on?'checked':''}> Mostrar na arara e no catálogo</label>
      <div class="share"><button class="btn btn-gold" type="submit">${novo?'Adicionar ao catálogo':'Salvar'}</button>${novo?'':'<button class="btn" type="button" id="mfDel">Excluir modelo</button>'}</div>
    </form></aside></div>`);
  const $ = q => root.querySelector(q);
  $('#mfPh').onchange = e => { const f=e.target.files[0]; if(!f) return; shrink(f).then(u=>{ x.foto=u; $('#mfIm').style.backgroundImage=`url(${u})`; $('#mfIm').innerHTML=''; }); };
  $('#mf').onsubmit = e => { e.preventDefault();
    Object.assign(x,{nome:$('#mfN').value.trim(), tipo:$('#mfT').value.trim(), cat:$('#mfC').value, feat:$('#mfF').value.trim(), tam:$('#mfZ').value.trim(), on:$('#mfO').checked,
      pecas:[...root.querySelectorAll('[name=pc]:checked')].map(c=>c.value), tecidos:[...root.querySelectorAll('[name=tc]:checked')].map(c=>c.value)});
    if (!x.pecas.length){ toast('Marque pelo menos uma peça.'); return; }
    if (novo) DB.catalogo.push(x); else DB.catalogo[i]=x; save(); close(); adminSite(); toast(novo?'Modelo adicionado ao catálogo':'Modelo salvo'); };
  const del = $('#mfDel'); if (del) del.onclick = () => { if (del.dataset.ok){ DB.catalogo.splice(i,1); save(); close(); adminSite(); toast('Modelo excluído'); } else { del.dataset.ok=1; del.textContent='Toque de novo para excluir'; } };
}

/* ====== util ====== */
function zoom(src){ const {root, close} = layer(`<div class="lb" role="dialog" aria-modal="true" aria-label="Foto ampliada"><img src="${h(src)}" alt="Foto ampliada"></div>`); root.addEventListener('click', close); }
let tt; function toast(msg){ document.querySelector('.toast')?.remove(); clearTimeout(tt); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); tt=setTimeout(()=>t.remove(),3200); }
render();
})();
</script>
